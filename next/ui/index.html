<!doctype html>
<html lang="ru" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexSearch 2.0</title><link rel="stylesheet" href="./style.css"><script type="module" src="./app.js"></script></head>
<body>
<aside class="sidebar"><div class="brand"><div class="brand-mark">N</div><div>NexSearch<small>Рабочее пространство</small></div></div><div class="nav-caption">РАБОТА</div><nav id="navigation" aria-label="Основные разделы"></nav><div class="sidebar-bottom"><div class="preview-pill">Предварительная 2.0</div><button id="settings-shortcut" class="quiet">Настройки пространства</button><div id="identity" class="identity"></div></div></aside>

</body></html>
