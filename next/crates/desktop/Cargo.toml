[package]
name = "nexsearch-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
autobins = false
[[bin]]
name = "nexsearch"
path = "src/main.rs"
[dependencies]
tauri = { version = "2", features = ["unstable"] }
nexsearch-core.workspace = true
nexsearch-compute.workspace = true
nexsearch-bridge.workspace = true
nexsearch-updates.workspace = true
tokio.workspace = true
serde_json.workspace = true
serde.workspace = true
uuid.workspace = true
base64 = "0.23"
open = "5"
tempfile = "3"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[lints]
workspace = true
