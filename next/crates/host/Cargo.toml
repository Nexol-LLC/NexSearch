[package]
name = "nexsearch-host"
version.workspace = true
edition.workspace = true
publish.workspace = true
[dependencies]
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
argon2 = "0.5"
rand = "0.8"
aes-gcm = "0.10"
tempfile = "3"
rust_decimal = "1"
base64 = "0.23"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
serde.workspace = true
uuid.workspace = true
url.workspace = true
nexsearch-core.workspace = true
nexsearch-jobs.workspace = true
regex = "1"
scraper = "0.24"
futures-util = "0.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
mail-parser = "0.11.5"
ammonia = "4.2"
html-escape = "0.2"
percent-encoding = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query", "form"] }
tokio.workspace = true
serde_json.workspace = true
[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
[lints]
workspace = true
