name: Build signed NexSearch updates
on:
  push:
    branches: [host, employe]
    paths-ignore: ['.updates/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nexsearch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache-dependency-path: |
            vpn/go.sum
            vpn/macos/go.sum
      - name: Build application VPN modules
        run: python vpn/build.py linux-amd64 darwin-amd64 darwin-arm64
      - run: pip install 'cryptography>=43,<47'
      - name: Sign source package
        id: sign
        env:
          NEXSEARCH_SIGNING_KEY: ${{ secrets.NEXSEARCH_SIGNING_KEY }}
        run: |
          if [ "${GITHUB_REF_NAME}" = host ]; then
            python package_update.py HostUbuntu --output .updates/host-linux.zip --commit "$GITHUB_SHA"
            echo 'path=.updates/host-linux.zip' >> "$GITHUB_OUTPUT"
          else
            python package_update.py EmployeeMac --output .updates/employee-mac.zip --commit "$GITHUB_SHA"
            echo 'path=.updates/employee-mac.zip' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with: {name: signed-source, path: '${{ steps.sign.outputs.path }}', include-hidden-files: true, if-no-files-found: error}
  windows:
    if: github.ref_name == 'employe'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache-dependency-path: |
            vpn/go.sum
            vpn/macos/go.sum
      - run: python vpn/build.py windows-amd64
      - run: pip install -r network/requirements.txt pyinstaller
      - run: python build_windows.py EmployeeWindows
      - run: python build_windows.py Maintenance
      - name: Sign Windows package
        env:
          NEXSEARCH_SIGNING_KEY: ${{ secrets.NEXSEARCH_SIGNING_KEY }}
        run: python package_update.py EmployeeWindows --output .updates/employee-windows.zip --commit $env:GITHUB_SHA
      - uses: actions/upload-artifact@v4
        with: {name: signed-windows, path: '.updates/employee-windows.zip', include-hidden-files: true, if-no-files-found: error}
  publish:
    if: always() && needs.source.result == 'success' && (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    needs: [source, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: 'signed-*', merge-multiple: true, path: .updates}
      - name: Commit artifacts to their source branch
        run: |
          git config user.name 'NexSearch Builds'
          git config user.email 'nexsearch-builds@users.noreply.github.com'
          # Another build may have published ZIPs since this checkout began.
          # Keep verified outputs aside, then commit onto the current branch tip.
          staged=$(mktemp -d)
          cp .updates/*.zip "$staged/"
          git restore .updates
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git checkout -B signed-updates "origin/$GITHUB_REF_NAME"
            if ! git diff --quiet "$GITHUB_SHA" HEAD -- . ':!.updates'; then
              echo 'A newer source revision exists; its build will publish updates.'
              exit 0
            fi
            cp "$staged/"*.zip .updates/
            git add .updates
            git diff --cached --quiet && exit 0
            git commit -m "Publish signed updates for ${GITHUB_SHA}"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
          done
          echo 'The branch kept changing while publishing updates.' >&2
          exit 1
